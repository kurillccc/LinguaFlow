# Shared style checks for application source.
included:
  - LinguaFlow
excluded:
  - LinguaFlow/Assets.xcassets
  - LinguaFlow/Resources
  - LinguaFlow.xcodeproj
  - Tests

line_length:
  warning: 140
  error: 200
  ignores_urls: true
  ignores_interpolated_strings: true

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 600
  error: 1000

identifier_name:
  min_length: 2
  max_length: 50
